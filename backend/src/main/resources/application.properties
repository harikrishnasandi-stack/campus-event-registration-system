# Server
server.port=8080

# Database - read from environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_events?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Campus2024!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Disable JPA/Hibernate entirely
spring.jpa.enabled=false

# JWT
jwt.secret=${JWT_SECRET:Campus3v3ntS3cr3tK3y2024SuperSecureKey!}
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads/certificates}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Campus Timezone & Notifications
app.campus.timezone=${CAMPUS_TIMEZONE:Asia/Kolkata}
app.notifications.cron=${NOTIFICATION_CRON:0 0 8 * * *}

# Logging
logging.level.com.campus=DEBUG
logging.level.org.springframework.security=WARN
